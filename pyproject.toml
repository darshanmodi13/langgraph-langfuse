[project]
name = "langgraph-langfuse"
version = "0.1.0"
description = "Learning LangGraph and self-hosted Langfuse with local Ollama models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain-core>=1.8.5",
    "langchain-ollama>=1.2.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff.lint]
# E/W = style errors, F = bugs like unused imports, I = import sorting
select = ["E", "W", "F", "I"]
ignore = ["E501"]  # long prompt strings are fine
